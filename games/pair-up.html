<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair Up</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #2a1f3d; color: #faf5ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; box-sizing: border-box; text-align: center; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 32px; color: #f0abfc; }
  .back { color: #f0abfc; text-decoration: none; font-weight: 600; }
  .back:hover { text-decoration: underline; }
  .modes { display: flex; gap: 8px; justify-content: center; margin: 14px 0 8px; }
  .modes button { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 999px; border: 2px solid #f0abfc;
    background: transparent; color: #f0abfc; cursor: pointer; }
  .modes button.on { background: #f0abfc; color: #2a1f3d; }
  .stats { display: flex; justify-content: center; gap: 22px; font-weight: 700; margin: 8px 0 14px; }
  .stats span { opacity: .9; }
  #board { display: grid; gap: 8px; margin: 0 auto; perspective: 800px; }
  .card { aspect-ratio: 1; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform .35s; border: 0; padding: 0; background: none; }
  .card.up, .card.done { transform: rotateY(180deg); }
  .card .f, .card .b { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; }
  .card .b { background: linear-gradient(135deg, #a855f7, #ec4899); box-shadow: inset 0 0 0 3px #ffffff33; }
  .card .b::after { content: "?"; font-size: 28px; font-weight: 800; color: #ffffff88; }
  .card .f { background: #faf5ff; transform: rotateY(180deg); font-size: clamp(22px, 7vw, 44px); }
  .card.done .f { background: #bbf7d0; }
  .card.shake { animation: shake .35s; }
  @keyframes shake { 25% { translate: -5px 0 } 75% { translate: 5px 0 } }
  #win { margin-top: 18px; font-size: 20px; font-weight: 700; color: #fde047; min-height: 28px; }
  #again { font: inherit; font-weight: 700; font-size: 18px; padding: 10px 28px; border-radius: 999px; border: 0;
    background: #f0abfc; color: #2a1f3d; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header><a class="back" href="../index.html">← All games</a><h1>PAIR UP</h1><span style="width:90px"></span></header>
  <div class="modes">
    <button data-n="4x4">Easy</button><button data-n="4x5">Medium</button><button data-n="6x6">Hard</button>
  </div>
  <div class="stats"><span id="moves">Moves: 0</span><span id="time">0:00</span><span id="best">Best: —</span></div>
  <div id="board"></div>
  <div id="win"></div>
  <button id="again">New game</button>
</main>
<script>
(() => {
  const ICONS = ['🍎','🐙','🚀','🌵','🎈','🦊','🍩','⚡','🎲','🐢','🌙','🍄','🎸','🦋','🧊','🔔','🌻','🐳'];
  const board = document.getElementById('board'), $moves = document.getElementById('moves'), $time = document.getElementById('time'),
        $best = document.getElementById('best'), $win = document.getElementById('win');
  let mode = '4x4';
  try { mode = localStorage.getItem('pairUpMode') || mode; } catch (e) {}
  let open = [], moves = 0, matched = 0, total = 0, t0 = 0, timer = null, lock = false;

  const bestKey = () => 'pairUpBest_' + mode;
  function readBest() { try { return JSON.parse(localStorage.getItem(bestKey())); } catch (e) { return null; } }
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function showBest() { const b = readBest(); $best.textContent = 'Best: ' + (b ? b.moves + ' moves' : '—'); }

  let actx;
  function beep(f, d, v = 0.05) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(1e-4, t + d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  }

  function newGame() {
    const [c, r] = mode.split('x').map(Number);
    total = c * r / 2;
    const pool = ICONS.slice().sort(() => Math.random() - .5).slice(0, total);
    const deck = [...pool, ...pool];
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    board.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
    board.style.maxWidth = Math.min(c * 110, 600) + 'px';
    board.innerHTML = '';
    deck.forEach(icon => {
      const el = document.createElement('button');
      el.className = 'card'; el.dataset.icon = icon; el.setAttribute('aria-label', 'Hidden card');
      el.innerHTML = `<div class="b"></div><div class="f">${icon}</div>`;
      el.addEventListener('click', () => flip(el));
      board.appendChild(el);
    });
    open = []; moves = 0; matched = 0; lock = false; t0 = 0;
    clearInterval(timer); timer = null;
    $moves.textContent = 'Moves: 0'; $time.textContent = '0:00'; $win.textContent = '';
    document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.n === mode));
    showBest();
  }

  function flip(el) {
    if (lock || el.classList.contains('up') || el.classList.contains('done')) return;
    if (!timer) { t0 = performance.now(); timer = setInterval(() => $time.textContent = fmt((performance.now() - t0) / 1000), 250); }
    el.classList.add('up'); el.setAttribute('aria-label', el.dataset.icon); open.push(el); beep(440, .06, .03);
    if (open.length < 2) return;
    moves++; $moves.textContent = 'Moves: ' + moves;
    const [a, b] = open; open = [];
    if (a.dataset.icon === b.dataset.icon) {
      setTimeout(() => { a.classList.add('done'); b.classList.add('done'); }, 250);
      matched++; beep(660, .1); setTimeout(() => beep(990, .12), 80);
      if (matched === total) finish();
    } else {
      lock = true;
      setTimeout(() => {
        a.classList.add('shake'); b.classList.add('shake'); beep(200, .12);
        setTimeout(() => { a.classList.remove('up', 'shake'); b.classList.remove('up', 'shake');
          a.setAttribute('aria-label', 'Hidden card'); b.setAttribute('aria-label', 'Hidden card'); lock = false; }, 380);
      }, 450);
    }
  }

  function finish() {
    clearInterval(timer); timer = null;
    const secs = (performance.now() - t0) / 1000, prev = readBest();
    let msg = `Cleared in ${moves} moves, ${fmt(secs)}!`;
    if (!prev || moves < prev.moves || (moves === prev.moves && secs < prev.secs)) {
      msg += ' ★ NEW BEST!';
      try { localStorage.setItem(bestKey(), JSON.stringify({ moves, secs })); } catch (e) {}
    }
    setTimeout(() => { $win.textContent = msg; showBest(); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i * 110)); }, 300);
  }

  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.n; try { localStorage.setItem('pairUpMode', mode); } catch (e) {} newGame();
  }));
  document.getElementById('again').addEventListener('click', newGame);
  newGame();
})();
</script>
</body>
</html>
